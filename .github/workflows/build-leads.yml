# Demo "leads" (S5): test + build image → GHCR (PRIVATE package: contains private module code).
# Deploy is done from the owner's machine (infra/deploy.sh), never from CI. Rules: SECURITY.md.
name: build-leads
on:
  push:
    branches: [main]
    paths: ["demos/leads/**", ".github/workflows/build-leads.yml"]
  workflow_dispatch:   # after module changes
permissions:
  contents: read
concurrency:
  group: build-leads
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout private sedlab-modules (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: sedyukov/sedlab-modules
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: demos/leads/.modules-src
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false            # build cache would contain compiled private code
      - name: go vet + test (quiet)
        working-directory: demos/leads
        run: go vet ./... && go test -count=1 -race ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout private sedlab-modules (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: sedyukov/sedlab-modules
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: demos/leads/.modules-src
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR visibility guard (before push)
        uses: ./.github/actions/ghcr-private-guard
        with:
          image: ghcr.io/${{ github.repository_owner }}/leads
          mode: probe
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/leads
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: demos/leads
          file: demos/leads/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # no attestation with paths/sources
          # NO cache-to: type=gha — public repo, layer cache would leak private module code
      - name: GHCR visibility guard (after push)
        uses: ./.github/actions/ghcr-private-guard
        with:
          image: ghcr.io/${{ github.repository_owner }}/leads
          mode: check
