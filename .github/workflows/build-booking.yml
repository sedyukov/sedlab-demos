# demos/booking (S3): tests + image ghcr.io/sedyukov/booking. Build only — deploy runs from the owner's Mac
# (infra/deploy.sh). Hygiene rules: SECURITY.md (push to main + manual, quiet tests, no caches/artifacts with
# private module code, private GHCR package, no provenance).
name: build-booking
on:
  push:
    branches: [main]
    paths: ["demos/booking/**", ".github/workflows/build-booking.yml"]   # module changes → workflow_dispatch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-booking-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout private sedlab-modules (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: sedyukov/sedlab-modules
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: modules-src
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: go vet + test (quiet)
        working-directory: demos/booking/server
        run: go vet ./... && go test -count=1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: web build
        working-directory: demos/booking/web
        run: npm ci --no-audit --no-fund --silent && npm run build --silent

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout private sedlab-modules (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: sedyukov/sedlab-modules
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: modules-src
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR visibility guard (before push)
        uses: ./.github/actions/ghcr-private-guard
        with:
          image: ghcr.io/${{ github.repository_owner }}/booking
          mode: probe
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/booking
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demos/booking/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # no cache-to: type=gha — public repo, layer cache would leak private module code
      - name: GHCR visibility guard (after push)
        uses: ./.github/actions/ghcr-private-guard
        with:
          image: ghcr.io/${{ github.repository_owner }}/booking
          mode: check
# Deploy (owner's Mac): ~/freelance/infra/deploy.sh booking --tag sha-<7>
