# demos/api: contract tests (Go + Python, one suite, parity) + image build to GHCR (PRIVATE package: it contains
# private module code). Deploy is done from the owner's machine (infra/deploy.sh). Rules: SECURITY.md.
name: build-api
on:
  push:
    branches: [main]
    paths: ["demos/api/**", ".github/workflows/build-api.yml"]   # module changes → workflow_dispatch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout private sedlab-modules (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: sedyukov/sedlab-modules
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: demos/api/.modules-src
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false                    # the module cache would contain private code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # no pip cache: it would contain private code
      - name: contract tests (Go, Python, parity; editions ru and intl)
        run: |
          cd demos/api
          (cd go && go vet ./... >/dev/null)
          python -m venv python/.venv
          python/.venv/bin/pip install -q ./.modules-src/modules/accounts/python -e './python[test]' >/dev/null
          QUIET=1 tests/run.sh ru
          QUIET=1 tests/run.sh intl
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: checkout private sedlab-modules (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: sedyukov/sedlab-modules
          ssh-key: ${{ secrets.MODULES_DEPLOY_KEY }}
          persist-credentials: false
          path: demos/api/.modules-src
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR visibility guard (before push)
        uses: ./.github/actions/ghcr-private-guard
        with:
          image: ghcr.io/${{ github.repository_owner }}/api
          mode: probe
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: demos/api
          file: demos/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # no cache-to: type=gha — the layer cache would leak private module code (public repo)
      - name: GHCR visibility guard (after push)
        uses: ./.github/actions/ghcr-private-guard
        with:
          image: ghcr.io/${{ github.repository_owner }}/api
          mode: check
# After the build: ~/freelance/infra/deploy.sh api-ru --host freelance-ru --tag sha-<7 chars>
